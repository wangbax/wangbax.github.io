# iwyatt: standalone static blog configuration
# Install as /etc/nginx/nginx.conf on a dedicated web server.
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;

    access_log /var/log/nginx/access.log;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml;

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;
        root /var/www/iwyatt/current;
        index index.html;
        charset utf-8;

        add_header X-Content-Type-Options nosniff always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok";
        }

        location / {
            try_files $uri $uri/ =404;
        }

        error_page 404 /404.html;

        location = /404.html {
            internal;
        }

        location ~ /\. {
            deny all;
        }

        location ~* \.(?:css|js|png|jpe?g|gif|ico|svg|woff2?|ttf|otf|eot)$ {
            expires 7d;
            try_files $uri =404;
        }
    }
}
