# wangbaxai.top: standalone static blog configuration
# Install as /etc/nginx/nginx.conf on a dedicated web server.
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;

    access_log /var/log/nginx/access.log;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml;

    ssl_certificate /etc/letsencrypt/live/www.wangbaxai.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.wangbaxai.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/acme;
            default_type text/plain;
            try_files $uri =404;
        }

        location / {
            return 301 https://www.wangbaxai.top$request_uri;
        }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name wangbaxai.top;
        return 301 https://www.wangbaxai.top$request_uri;
    }

    server {
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        server_name www.wangbaxai.top;
        root /var/www/iwyatt/current;
        index index.html;
        charset utf-8;

        add_header X-Content-Type-Options nosniff always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok";
        }

        location / {
            try_files $uri $uri/ =404;
        }

        error_page 404 /404.html;

        location = /404.html {
            internal;
        }

        location ~ /\. {
            deny all;
        }

        location ~* \.(?:css|js|png|jpe?g|gif|ico|svg|woff2?|ttf|otf|eot)$ {
            expires 7d;
            try_files $uri =404;
        }
    }
}
