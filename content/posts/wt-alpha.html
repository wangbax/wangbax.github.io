<h2 id="简介"><a href="#简介" class="headerlink" title="简介"></a>简介</h2><p>由于项目实际开发中，设计师习惯报百分比形容颜色透明度，每次都需要手动换算，非常麻烦，故记录一些常用的透明度换算。</p>

<h3 id="简单的在线换算工具"><a href="#简单的在线换算工具" class="headerlink" title="简单的在线换算工具"></a>简单的在线换算工具</h3>
